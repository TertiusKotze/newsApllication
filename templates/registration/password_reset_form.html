{% extends "registration/base_auth.html" %}

{% block title %}Password Reset{% endblock %}
{% block heading %}Reset your password{% endblock %}

{% block content %}
<p class="muted">Enter your account email and we will send password reset instructions.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
</form>
{% endblock %}
