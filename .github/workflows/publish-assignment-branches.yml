name: Publish assignment branches

# Creates the docs and container branch names required by the capstone task.
# Safe to re-run: an existing ref is left unchanged.
on:
  push:
    branches:
      - copilot/create-branches-and-requirements
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Create docs and container refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"
          create_ref() {
            name="$1"
            sha="$2"
            code=$(curl -sS -o /tmp/ref-body -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}" \
              -d "{\"ref\":\"refs/heads/${name}\",\"sha\":\"${sha}\"}")
            echo "${name}: HTTP ${code}"
            cat /tmp/ref-body
            echo
            if [ "${code}" = "201" ]; then
              return 0
            fi
            if [ "${code}" = "422" ] && grep -q "Reference already exists" /tmp/ref-body; then
              return 0
            fi
            exit 1
          }
          create_ref docs f4ab8b5f2d0c1b3f21c01bc244065fb0703ba6a3
          create_ref container a0528146cef46ce671331a67e9f6fff7cdfa5155
