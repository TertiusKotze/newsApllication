# Local Docker stack for the news application and MariaDB.
# Passwords come from a gitignored .env file when you create one.
# The defaults below are local placeholders only. Change them before
# sharing the machine or deploying anywhere else.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-news_db}
      MARIADB_USER: ${DB_USER:-news_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_NAME: ${DB_NAME:-news_db}
      DB_USER: ${DB_USER:-news_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_HOST: db
      DB_PORT: "3306"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@news.local}
      INTERNAL_API_BASE_URL: http://127.0.0.1:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-key}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
