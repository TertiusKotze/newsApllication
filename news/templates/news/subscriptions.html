{% extends "base.html" %}

{% block title %}Subscriptions{% endblock %}

{% block body %}
<div class="card">
    <h1>Your subscriptions</h1>
    <p class="muted">
        Follow publishers and journalists. Approved stories from those sources
        appear in your subscribed API feed and trigger email delivery.
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save subscriptions</button>
    </form>
</div>
{% endblock %}
